name: Security analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Analyze source
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check dependency graph support
        id: dependency-graph
        run: |
          status="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            | python -c 'import json,sys; print((json.load(sys.stdin).get("security_and_analysis") or {}).get("dependency_graph", {}).get("status", "unsupported"))')"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Check out source
        if: steps.dependency-graph.outputs.status == 'enabled'
        uses: actions/checkout@v4

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.status == 'enabled'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Skip dependency review
        if: steps.dependency-graph.outputs.status != 'enabled'
        run: echo "Dependency graph is not enabled for this repository; skipping dependency review."
