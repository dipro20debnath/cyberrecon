  save_directory: reports
  screenshots: false
active:
  enabled: false
  allowed_targets: []
  allow_private_targets: false
  check_zone_transfer: false
  ports:
  - 21
  - 22
  - 25
  - 53
  - 80
  - 110
  - 143
  - 443
  - 445
  - 587
  - 993
  - 995
  - 3306
  - 5432
  - 6379
  - 8080
  - 8443
