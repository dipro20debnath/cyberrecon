api_keys:
  virustotal: ''
  securitytrails: ''
  shodan: ''
  censys: ''
  urlscan: ''
  ipinfo: ''
wordlists:
  subdomains: wordlists/subdomains.txt
  dns: wordlists/dns-names.txt
  ports: wordlists/top-ports.txt
settings:
  timeout: 10
  threads: 20
  rate_limit: 1.0
  max_retries: 2
  cache_ttl: 3600
